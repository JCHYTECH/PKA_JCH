  .filters button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .filters button:hover { border-color: var(--blue); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; transition: border-color 0.15s; }
  .card:hover { border-color: var(--blue); }
  .card.evaluated { border-left: 3px solid var(--green); }
  .thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--border); }
  .score-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1em; flex-shrink: 0; color: #000; }
  .tier-EXCELLENT { background: var(--green); }
  .tier-TRÈS_BON { background: #a371f7; }
  .tier-BON { background: var(--yellow); }
  .tier-À_AMÉLIORER { background: var(--orange); }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; font-size: 0.95em; }
  .info .species { color: var(--muted); font-size: 0.8em; margin: 2px 0; }
  .info .exif { color: var(--muted); font-size: 0.75em; }
  .bars { display: flex; gap: 4px; margin-top: 6px; }
  .bar-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bar-group .label { font-size: 0.6em; color: var(--muted); }
  .bar { width: 22px; border-radius: 3px 3px 0 0; }
  .bar-inner { width: 100%; border-radius: 3px; transition: height 0.3s; }
  .eval-panel { display: none; flex-shrink: 0; gap: 6px; flex-direction: column; align-items: center; }
  .card.expanded .eval-panel { display: flex; }
  .eval-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; font-size: 1.1em; transition: all 0.15s; }
  .eval-btn.good:hover, .eval-btn.good.selected { border-color: var(--green); background: rgba(63,185,80,0.15); }
  .eval-btn.ok:hover, .eval-btn.ok.selected { border-color: var(--yellow); background: rgba(210,153,29,0.15); }
  .eval-btn.bad:hover, .eval-btn.bad.selected { border-color: var(--red); background: rgba(248,81,73,0.15); }
  .eval-label { font-size: 0.65em; color: var(--muted); }
  .progress { margin-top: 20px; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .progress h3 { font-size: 0.9em; margin-bottom: 8px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>

const TIER_LABELS = { "EXCELLENT": "Excellent", "TRÈS BON": "Très Bon", "BON": "Bon", "À AMÉLIORER": "À améliorer" };
const TIER_CLASS = { "EXCELLENT": "tier-EXCELLENT", "TRÈS BON": "tier-TRÈS_BON", "BON": "tier-BON", "À AMÉLIORER": "tier-À_AMÉLIORER" };
const SCORE_COLORS = { c: '#58a6ff', e: '#3fb950', n: '#f0883e', t: '#a371f7', i: '#f85149' };
const SCORE_LABELS = { c: 'Compo', e: 'Expo', n: 'Net', t: 'Tech', i: 'Impact' };

let evals = JSON.parse(localStorage.getItem('argus_evals') || '{}');
// Sync any existing evaluations to server
if (Object.keys(evals).length > 0) {
  fetch('/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(evals)})
    .then(r => r.json()).then(d => { document.getElementById('save-status').textContent = '✓ ' + d.saved + ' restaurées'; })
    .catch(() => {});
}
let activeFilter = 'all';

function saveEval(id, value) {
  if (evals[id] === value) { delete evals[id]; }
  else { evals[id] = value; }
  localStorage.setItem('argus_evals', JSON.stringify(evals));
  // Auto-save to server
  fetch('/save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(evals)
  }).then(r => r.json()).then(d => {
    document.getElementById('save-status').textContent = '✓ ' + d.saved + ' sauvegardées';
  }).catch(() => {});
  render();
}

function render() {
  const container = document.getElementById('cards');
  let filtered = ANALYSES;
  if (activeFilter === 'unevaluated') filtered = ANALYSES.filter(a => !evals[a.id]);
  else if (activeFilter !== 'all') filtered = ANALYSES.filter(a => a.tier === activeFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">✅ Toutes les analyses de cette catégorie sont évaluées.</div>';
  } else {
    container.innerHTML = filtered.map(a => {
      const ev = evals[a.id];
      const maxScore = Math.max(a.c, a.e, a.n, a.t, a.i);
      return `
        <div class="card${ev ? ' evaluated' : ''}" onclick="toggleCard(this, ${a.id})">
          <div class="score-circle ${TIER_CLASS[a.tier]}">${a.score}</div>
          ${a.thumb ? `<img src="${a.thumb}" class="thumb" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="info">
            <div class="name">${a.file} <span style="color:var(--muted);font-size:0.8em">${TIER_LABELS[a.tier]}</span></div>
            <div class="species">🐾 ${a.species || '—'}</div>
            <div class="exif">📷 ${a.fl}mm · f/${a.ap} · ISO${a.iso} · ${a.ss}s</div>
            <div class="bars">
              ${['c','e','n','t','i'].map(k => `
                <div class="bar-group">
                  <div class="bar" style="height:60px;background:var(--border)"><div class="bar-inner" style="height:${(a[k]/20*100)}%;background:${SCORE_COLORS[k]}"></div></div>
                  <div class="label">${SCORE_LABELS[k]}<br>${a[k]}</div>
                </div>`).join('')}
            </div>
          </div>
          <div class="eval-panel">
            <div class="eval-label">Prompt</div>
            <button class="eval-btn good${ev==='good'?' selected':''}" onclick="event.stopPropagation();saveEval(${a.id},'good')" title="Analyse pertinente et utile">👍</button>
            <button class="eval-btn ok${ev==='ok'?' selected':''}" onclick="event.stopPropagation();saveEval(${a.id},'ok')" title="Correct mais perfectible">👌</button>
            <button class="eval-btn bad${ev==='bad'?' selected':''}" onclick="event.stopPropagation();saveEval(${a.id},'bad')" title="Erreurs ou à revoir">👎</button>
            <a href="${a.pdf}" target="_blank" onclick="event.stopPropagation()" style="font-size:0.7em;margin-top:4px">📄 PDF</a>
          </div>
        </div>`;
    }).join('');
  }

  // Stats
  const total = ANALYSES.length;
  const evCount = Object.keys(evals).length;
  const good = Object.values(evals).filter(v => v === 'good').length;
  const ok = Object.values(evals).filter(v => v === 'ok').length;
  const bad = Object.values(evals).filter(v => v === 'bad').length;
  document.getElementById('stat-eval').textContent = evCount;
  document.getElementById('stat-good').textContent = good;
  document.getElementById('stat-ok').textContent = ok;
  document.getElementById('stat-bad').textContent = bad;
  document.getElementById('prog-text').textContent = `${evCount}/${total} évaluées`;
  document.getElementById('prog-fill').style.width = `${(evCount/total*100).toFixed(0)}%`;
}

function toggleCard(el, id) {
  el.classList.toggle('expanded');
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

render();
</script>

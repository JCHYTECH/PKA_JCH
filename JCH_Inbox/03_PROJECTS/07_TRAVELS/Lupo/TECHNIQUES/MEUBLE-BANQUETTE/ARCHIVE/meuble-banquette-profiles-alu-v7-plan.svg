<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 600" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill:#3a3a3a; }
    .panel { fill:#d6e6f2; stroke:#7ba3c9; stroke-width:1; }
    .volet { fill:#f7dcb8; stroke:#d99a4e; stroke-width:1; }
    .table { fill:#cfe4cf; stroke:#6ba36b; stroke-width:1.2; }
    .slide { stroke:#c0392b; stroke-width:2.5; fill:none; }
    .ghost { stroke:#c0392b; stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
    .hinge { stroke:#8a5a2b; stroke-width:1.5; stroke-dasharray:3 3; }
    .dim { stroke:#1f5fa8; stroke-width:1; }
    .dimt { fill:#1f5fa8; font-size:11px; }
    .lbl { font-size:11px; fill:#222; }
    .ttl { font-size:16px; font-weight:bold; fill:#111; }
    .sub { font-size:12px; fill:#555; }
  </style>

  <text x="40" y="32" class="ttl">Meuble banquette Lupo — v7 aluminium T-slot 2020</text>
  <text x="40" y="50" class="sub">Module A (344 × 540 × 256 mm) · sans tiroir · volets rabattables 90° · table coulissante double sens</text>

  <!-- ================= ÉLÉVATION AVANT (module A) ================= -->
  <g>
    <text x="40" y="80" class="lbl" font-weight="bold">Élévation avant (côté allée)</text>

    <!-- table HPL 12 (flush, assise) -->
    <rect x="44" y="90" width="336" height="12" class="table"/>
    <text x="360" y="99" class="lbl">table HPL 12 (assise)</text>

    <!-- frame : rails haut/bas + montants -->
    <rect x="40" y="90" width="344" height="20" class="frame"/>
    <rect x="40" y="326" width="344" height="20" class="frame"/>
    <rect x="40" y="110" width="20" height="216" class="frame"/>
    <rect x="364" y="110" width="20" height="216" class="frame"/>

    <!-- volet avant -->
    <rect x="60" y="110" width="304" height="216" class="volet"/>
    <line x1="60" y1="326" x2="364" y2="326" class="hinge"/>
    <circle cx="212" cy="120" r="4" fill="#8a5a2b"/>
    <text x="212" y="116" class="lbl" text-anchor="middle">loquet</text>
    <text x="212" y="230" class="lbl" text-anchor="middle">volet 304×216</text>
    <text x="212" y="334" class="lbl" text-anchor="middle">charnière piano (arête basse)</text>

    <!-- flèche volet rabattu -->
    <path d="M 40 340 Q 40 380 20 400" class="ghost"/>
    <rect x="0" y="396" width="304" height="14" class="volet" opacity="0.5"/>
    <text x="10" y="424" class="lbl">volet rabattu 90° (à plat au sol)</text>

    <!-- cotes largeur / hauteur -->
    <line x1="40" y1="360" x2="384" y2="360" class="dim"/>
    <line x1="40" y1="356" x2="40" y2="364" class="dim"/>
    <line x1="384" y1="356" x2="384" y2="364" class="dim"/>
    <text x="212" y="374" class="dimt" text-anchor="middle">344</text>

    <line x1="392" y1="90" x2="392" y2="346" class="dim"/>
    <line x1="388" y1="90" x2="396" y2="90" class="dim"/>
    <line x1="388" y1="346" x2="396" y2="346" class="dim"/>
    <text x="404" y="222" class="dimt">256</text>

    <!-- cote montant -->
    <line x1="28" y1="110" x2="28" y2="326" class="dim"/>
    <line x1="24" y1="110" x2="32" y2="110" class="dim"/>
    <line x1="24" y1="326" x2="32" y2="326" class="dim"/>
    <text x="6" y="222" class="dimt">216</text>
  </g>

  <!-- ================= ÉLÉVATION LATÉRALE (module A) ================= -->
  <g>
    <text x="460" y="80" class="lbl" font-weight="bold">Élévation latérale (profondeur 540)</text>

    <!-- frame côté : 540 × 256 -->
    <rect x="460" y="90" width="540" height="256" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="460" y="90" width="540" height="20" class="frame"/>
    <rect x="460" y="326" width="540" height="20" class="frame"/>
    <rect x="460" y="110" width="20" height="216" class="frame"/>
    <rect x="980" y="110" width="20" height="216" class="frame"/>

    <!-- panneau latéral -->
    <rect x="480" y="110" width="500" height="216" class="panel"/>
    <text x="730" y="222" class="lbl" text-anchor="middle">panneau côté Dibond 3</text>

    <!-- table HPL 12 au-dessus + sortie 300 -->
    <rect x="460" y="78" width="540" height="12" class="table"/>
    <rect x="1000" y="78" width="300" height="12" class="table" opacity="0.45"/>
    <rect x="1000" y="78" width="300" height="12" class="ghost"/>
    <text x="1150" y="72" class="lbl" text-anchor="middle">table sortie 300</text>

    <!-- coulisses double sens -->
    <line x1="460" y1="104" x2="1000" y2="104" class="slide"/>
    <line x1="460" y1="140" x2="1000" y2="140" class="slide"/>
    <text x="720" y="98" class="lbl">coulisse D5DD (double sens) — rails latéraux hauts</text>

    <!-- cote profondeur -->
    <line x1="460" y1="360" x2="1000" y2="360" class="dim"/>
    <line x1="460" y1="356" x2="460" y2="364" class="dim"/>
    <line x1="1000" y1="356" x2="1000" y2="364" class="dim"/>
    <text x="730" y="374" class="dimt" text-anchor="middle">540</text>

    <!-- cote sortie table -->
    <line x1="1000" y1="66" x2="1300" y2="66" class="dim"/>
    <line x1="1000" y1="62" x2="1000" y2="70" class="dim"/>
    <line x1="1300" y1="62" x2="1300" y2="70" class="dim"/>
    <text x="1150" y="60" class="dimt" text-anchor="middle">300</text>
  </g>

  <!-- ================= VUE D'ENSEMBLE (3 modules) ================= -->
  <g>
    <text x="40" y="460" class="lbl" font-weight="bold">Vue d'ensemble — 3 modules solidarisés (empreinte 920 × 540)</text>
    <!-- A (344) + B (288) + C (288) = 920, échelle 0.5 -->
    <rect x="40" y="470" width="172" height="128" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="212" y="470" width="144" height="128" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="356" y="470" width="144" height="128" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="40" y="470" width="172" height="6" class="table"/>
    <rect x="212" y="470" width="144" height="6" class="table"/>
    <rect x="356" y="470" width="144" height="6" class="table"/>
    <text x="126" y="540" class="lbl" text-anchor="middle">A · 344</text>
    <text x="284" y="540" class="lbl" text-anchor="middle">B · 288</text>
    <text x="428" y="540" class="lbl" text-anchor="middle">C · 288</text>
    <text x="40" y="560" class="lbl" text-anchor="middle">⇅ accès double sens (volets avant/arrière)</text>
  </g>

  <!-- ================= LÉGENDE ================= -->
  <g>
    <text x="540" y="470" class="lbl" font-weight="bold">Légende</text>
    <rect x="540" y="478" width="16" height="10" class="frame"/><text x="564" y="487" class="lbl">profilé 2020 (20×20)</text>
    <rect x="540" y="494" width="16" height="10" class="table"/><text x="564" y="503" class="lbl">table / assise HPL 12</text>
    <rect x="540" y="510" width="16" height="10" class="volet"/><text x="564" y="519" class="lbl">volet Dibond 3 (rabattable)</text>
    <rect x="540" y="526" width="16" height="10" class="panel"/><text x="564" y="535" class="lbl">panneau Dibond 3 (fixe)</text>
    <line x1="540" y1="548" x2="556" y2="548" class="slide"/><text x="564" y="552" class="lbl">coulisse D5DD (double sens)</text>
    <text x="540" y="572" class="sub">Cotes en mm · hors tout 256 mm · table sortie 300 mm</text>
  </g>
</svg>

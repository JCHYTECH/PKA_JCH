<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1560" font-family="Helvetica, Arial, sans-serif">
<style>
.frame{fill:none;stroke:#1a1a1a;stroke-width:3}.panel{fill:#f5e6c8;stroke:#8a6d3b;stroke-width:2}
.drawer{fill:#e8d5a8;stroke:#8a6d3b;stroke-width:2}.trap{fill:#cdb27a;stroke:#6b5328;stroke-width:2}
.hardware{fill:#333}.dim{stroke:#b30000;stroke-width:1.2}.dimtxt{fill:#b30000;font-size:22px}
.label{fill:#1a1a1a;font-size:26px;font-weight:bold}.note{fill:#444;font-size:20px}
</style>
<text x="50" y="45" class="label">Meuble banquette — Module A · 344 × 540 × 256 mm · Échelle 1/2 (face/profil), 2/3 (dessus)</text>

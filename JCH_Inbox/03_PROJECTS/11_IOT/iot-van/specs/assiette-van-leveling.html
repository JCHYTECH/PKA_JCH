<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Assiette Lupo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assiette Lupo">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:#111118;color:#e4e4ec;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:-webkit-fill-available;padding:20px 16px 28px;-webkit-font-smoothing:antialiased}
h1{font-size:1.35em;font-weight:700;letter-spacing:-.02em;color:#f0a030;margin-bottom:2px;text-align:center}
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:.82em;font-weight:600;margin-bottom:12px;letter-spacing:-.01em;transition:all .35s}
.status.ok{background:rgba(56,161,105,.18);color:#38a169}
.status.nok{background:rgba(229,83,83,.18);color:#e55353}
.status.wait{background:rgba(255,255,255,.06);color:#5a5a72}
.van-topview{position:relative;width:330px;height:220px;margin:4px 0 10px}
.van-image-wrap{position:absolute;width:240px;height:160px;top:50%;left:50%;margin-left:-120px;margin-top:-80px;transition:transform .4s cubic-bezier(.22,.61,.36,1);display:flex;align-items:center;justify-content:center}
.van-silhouette{width:100%;height:100%;object-fit:contain;transform:rotate(180deg);opacity:.85;filter:drop-shadow(0 0 14px rgba(240,160,48,.3))}
.wheel{position:absolute;width:18px;height:18px;background:#1a1a26;border:3px solid #555;border-radius:50%;transition:all .35s;z-index:3}
.wheel::after{content:'';position:absolute;top:2px;left:2px;right:2px;bottom:2px;background:#3a3a4a;border-radius:50%}
.wheel.lift{border-color:#f0a030;background:#3d2800;box-shadow:0 0 18px rgba(240,160,48,.25),inset 0 0 6px rgba(240,160,48,.2);animation:pulse 1.1s infinite}
.wheel.lift::after{background:#6b4200}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(240,160,48,.25)}50%{box-shadow:0 0 24px rgba(240,160,48,.5)}}
.wheel.fl{top:50%;left:50%;margin-left:-110px;margin-top:-74px}
.wheel.fr{top:50%;left:50%;margin-left:94px;margin-top:-74px}
.wheel.rl{top:50%;left:50%;margin-left:-110px;margin-top:58px}
.wheel.rr{top:50%;left:50%;margin-left:94px;margin-top:58px}
.values{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin-bottom:10px}
.card{background:#1c1c2a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 10px;text-align:center;transition:all .3s}
.card .label{font-size:.7em;text-transform:uppercase;letter-spacing:.06em;color:#5a5a72;margin-bottom:4px}
.card .val{font-size:2em;font-weight:700;letter-spacing:-.02em}
.card.green .val{color:#38a169}
.card.red .val{color:#e55353}
.instructions{width:100%;max-width:340px;background:#1c1c2a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;font-size:.92em;line-height:1.55;min-height:60px;color:#8888a0}
.instructions .arrow{color:#f0a030;font-weight:700}
.instructions .height{color:#f0a030;font-size:1.35em;font-weight:700}
button{margin-top:14px;padding:14px 48px;font-size:1.1em;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;letter-spacing:-.01em;background:#f0a030;color:#111118;border:none;border-radius:10px;cursor:pointer;width:90%;max-width:320px;transition:all .2s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97);opacity:.85}
.note{font-size:.68em;color:#5a5a72;margin-top:12px;text-align:center;max-width:300px;line-height:1.4}
.debug{font-size:.6em;color:#3d3d54;margin-top:6px;text-align:center}
.wheel-badge{position:absolute;font-size:.58em;font-weight:700;color:#f0a030;background:#1c1c2a;border:1px solid #f0a030;border-radius:4px;padding:1px 4px;white-space:nowrap;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s;transform:translate(-50%,14px)}
.wheel-badge.show{opacity:1}
</style>
</head>

<div class="note">iPhone 17 Pro Max avec coque (offset −1.6°)<br>Haut du téléphone vers l'AVANT du van</div>
<div class="debug" id="debug"></div>
<script>
const WHEELBASE = 3500, TRACK = 1740;
const PITCH_OFFSET = -1.6; // Correction coque iPhone 17 Pro Max
let active = false;

function updateDisplay(p, r) {
  const pp = Math.round(p*10)/10, pr = Math.round(r*10)/10;
  document.getElementById('pitchVal').textContent = pp.toFixed(1) + '°';
  document.getElementById('rollVal').textContent = pr.toFixed(1) + '°';
  const absP = Math.abs(pp), absR = Math.abs(pr);
  document.getElementById('pitchCard').className = 'card ' + (absP < 1.5 ? 'green' : 'red');
  document.getElementById('rollCard').className = 'card ' + (absR < 1.5 ? 'green' : 'red');
  const level = absP < 1.5 && absR < 1.5;
  const se = document.getElementById('permStatus');
  se.textContent = level ? '✅ Niveau OK — bon camping !' : '⚠️ Van pas de niveau';
  se.className = 'status ' + (level ? 'ok' : 'nok');
  
  // Tilt visual
  document.getElementById('vanImageWrap').style.transform = 'perspective(500px) rotateX('+(-pp*0.8)+'deg) rotateY('+(-pr*0.8)+'deg)';
  
  // Clear wheel highlights
  ['wFL','wFR','wRL','wRR'].forEach(id => document.getElementById(id).className = document.getElementById(id).className.replace(' lift',''));
  
  // Determine lowest corner(s)
  const fl=pp<-1, rl=pp>1, ll=pr>1, ril=pr<-1;
  let lw=[];
  if(fl&&ll)lw=['FL'];else if(fl&&ril)lw=['FR'];else if(rl&&ll)lw=['RL'];else if(rl&&ril)lw=['RR'];
  else if(fl)lw=['FL','FR'];else if(rl)lw=['RL','RR'];else if(ll)lw=['FL','RL'];else if(ril)lw=['FR','RR'];
  lw.forEach(id => document.getElementById('w'+id).className += ' lift');
  
  // Calculate individual wheel heights and update badges
  const pH = Math.round(Math.tan(absP*Math.PI/180)*WHEELBASE/2);
  const rH = Math.round(Math.tan(absR*Math.PI/180)*TRACK/2);
  
  // Hide all badges first
  ['FL','FR','RL','RR'].forEach(id => {
    document.getElementById('b'+id).className = 'wheel-badge';
    document.getElementById('b'+id).textContent = '';
  });
  
  // Show badge with height on each lifted wheel
  lw.forEach(id => {
    let wh = 0;
    if (lw.length === 1) wh = pH + rH;
    else if (fl||rl) wh = pH;   // both wheels on same axle
    else wh = rH;               // both wheels on same side
    const badge = document.getElementById('b'+id);
    badge.textContent = wh + 'mm';
    badge.className = 'wheel-badge show';
  });
  
  let h=''; const wn={FL:'avant gauche',FR:'avant droite',RL:'arrière gauche',RR:'arrière droite'};
  if(level) h='✅ Van de niveau. Bonne nuit !';
  else if(lw.length===1){
    h='<span class="arrow">🎈 Roue '+wn[lw[0]]+'</span><br>Coussin gonflé à <span class="height">'+(pH+rH)+' mm</span> ('+((pH+rH)/10).toFixed(1)+' cm)';
  } else if(lw.length===2){
    const ph=fl||rl?pH:rH;
    const w1=wn[lw[0]], w2=wn[lw[1]];
    h='<span class="arrow">🎈 Roues '+w1+' + '+w2+'</span><br>Coussins gonflés à <span class="height">'+ph+' mm</span> ('+(ph/10).toFixed(1)+' cm) chaque';
  }
  document.getElementById('instr').innerHTML = h;
}

let lastUpdate = 0;
function onMotion(e) {
  if (!active) return;
  const now = Date.now();
  if (now - lastUpdate < 2000) return;
  lastUpdate = now;
  const g = e.accelerationIncludingGravity;
  if (!g || g.x === null) return;
  const {x, y, z} = g;
  const pitchRaw = Math.atan2(y, -z) * 180 / Math.PI;
  const roll  = Math.atan2(x, -z) * 180 / Math.PI;
  document.getElementById('debug').textContent = 'x='+x.toFixed(3)+' y='+y.toFixed(3)+' z='+z.toFixed(3)+' (rafraîchi/2s)';
  const pitch = pitchRaw - PITCH_OFFSET;
  updateDisplay(pitch, roll);
}

function doActivate() {
  const se = document.getElementById('permStatus');
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    se.textContent = '⏳ Autorisation...';
    se.className = 'status wait';
    DeviceMotionEvent.requestPermission().then(perm => {
      if (perm === 'granted') {
        active = true;
        window.addEventListener('devicemotion', onMotion);
        se.textContent = '📡 Pose l iPhone à plat au plancher';
        se.className = 'status ok';
        document.querySelector('button').textContent = '✅ Activé';
        document.querySelector('button').style.background = '#2a9d8f';
      } else {
        se.textContent = '❌ Refusé — autorise dans Réglages > Safari';
        se.className = 'status nok';
      }
    }).catch(e => { se.textContent = '❌ '+e.message; se.className = 'status nok'; });
  } else {
    active = true;
    window.addEventListener('devicemotion', onMotion);
    se.textContent = '📡 Pose l iPhone à plat au plancher';
    se.className = 'status ok';
    document.querySelector('button').textContent = '✅ Activé';
    document.querySelector('button').style.background = '#2a9d8f';
  }
}

if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) { doActivate(); }
</script>
</body>
</html>

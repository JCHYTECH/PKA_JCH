    <path d="M980,350 L976,270 Q978,245 972,220 Q975,195 980,175 Q985,155 990,140 Q995,130 1000,125 Q1005,122 1010,125 Q1015,130 1020,140 Q1025,155 1028,175 Q1030,195 1028,220 Q1022,245 1025,270 L1020,350"/>
    <path d="M990,160 Q960,145 940,125" stroke="black" stroke-width="2.5" fill="none"/>
    <path d="M1015,155 Q1040,140 1060,115" stroke="black" stroke-width="2.5" fill="none"/>

    <!-- Troisième arbre — fond, plus petit -->

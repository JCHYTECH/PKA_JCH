    <path d="M220,240 Q232,235 238,240 Q232,245 220,240"/>
    <path d="M270,215 Q282,210 288,215 Q282,220 270,215"/>
    <path d="M330,185 Q342,180 348,185 Q342,190 330,185"/>
    <path d="M400,155 Q412,150 418,155 Q412,160 400,155"/>
    <path d="M480,120 Q492,115 498,120 Q492,125 480,120"/>

    <!-- Ligne de sol montante (diagonale) -->
    <path d="M30,460 Q60,455 90,460 Q120,450 150,445 Q180,440 210,445 Q240,435 270,430 Q300,425 330,430 Q360,420 390,415 Q420,410 450,415 Q480,400 510,395 Q540,390 570,395 Q600,380 630,375 Q660,370 690,375 Q720,360 750,355 Q780,350 810,355 Q840,340 870,335 Q900,330 930,325 Q960,318 990,310 Q1020,305 1050,300 Q1080,295 1110,290 Q1140,285 1170,280" fill="none" stroke="black" stroke-width="1.5"/>

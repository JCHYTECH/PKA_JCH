<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKA — Kanban</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pka-theme.css">
<style>
  :root { --urgent:#e67e22; --in-progress:#2c6fce; --waiting:#b3452f; --validation:#d4ac0d; --done:#2f9e5b; }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Space Grotesk',sans-serif; background:var(--fond-global); color:var(--texte-clair); min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .header { background:var(--carte-bg); padding:16px 32px; display:flex; align-items:baseline; justify-content:space-between; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--bordure); }
  .header-title { font-size:18px; font-weight:300; letter-spacing:0.1em; }
  .header-title span { color:var(--ocre); }
  .header-sub { font-size:11px; color:var(--texte-mute); margin-left:16px; }
  .back { font-size:11px; color:var(--texte-mute); }
  .filters { background:var(--fond-global); border-bottom:1px solid var(--bordure); padding:10px 32px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters-label { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--texte-mute); }
  .kf-btn { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:500; padding:4px 12px; border:1px solid var(--bordure); background:var(--carte-bg); color:var(--texte-gris); cursor:pointer; border-radius:4px; }
  .kf-btn:hover { background:var(--bordure); color:var(--texte-clair); }
  .kf-btn.active { background:var(--bordure); color:var(--texte-clair); border-color:var(--texte-gris); }
  select.kf-btn { appearance:none; padding-right:24px; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; padding:24px 32px; align-items:start; }
  .kc { background:var(--carte-bg); border:1px solid var(--bordure); border-radius:8px; display:flex; flex-direction:column; }
  .kc-header { padding:10px 14px; border-bottom:1px solid var(--bordure); display:flex; justify-content:space-between; align-items:center; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; }
  .kc-header-count { font-size:11px; color:var(--texte-mute); }
  .kc-list { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:40px; }
  .card { background:var(--fond-global); border:1px solid var(--bordure); border-radius:6px; padding:10px 12px; font-size:12px; line-height:1.45; }
  .card.hidden { display:none; }
  .card-top { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .card-project { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ocre); }
  .card-prio { font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--texte-mute); }
  .card-title { color:var(--texte-clair); }
  .card-owner { margin-top:6px; font-size:10px; color:var(--texte-mute); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .empty { color:var(--texte-mute); font-size:11px; padding:8px 4px; text-align:center; }
  .statsbar { padding:0 32px 24px; font-size:11px; color:var(--texte-mute); }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:baseline;flex-wrap:wrap;">
    <div class="header-title"><span>📊</span> Kanban PKA</div>
    <div class="header-sub" id="subtitle">source : thread files → TTD.md · chargement…</div>
  </div>
  <a class="back" href="/hub.html">← Hub</a>
</div>

<div class="filters">
  <span class="filters-label">Projet</span>
  <select class="kf-btn" id="f-project" onchange="applyFilters()"><option value="all">Tous</option></select>
  <span class="filters-label">Statut</span>
  <button class="kf-btn active" data-filter="status" data-value="all" onclick="setStatus('all', this)">Tous</button>
  <button class="kf-btn" data-filter="status" data-value="En cours" onclick="setStatus('En cours', this)">En cours</button>
  <button class="kf-btn" data-filter="status" data-value="En attente" onclick="setStatus('En attente', this)">Bloqués</button>
  <button class="kf-btn" data-filter="status" data-value="En validation" onclick="setStatus('En validation', this)">Attente JC</button>
  <button class="kf-btn" data-filter="status" data-value="Termine" onclick="setStatus('Termine', this)">Terminés</button>
</div>

<div class="board" id="board"></div>
<div class="statsbar" id="statsbar"></div>

<script>
const STATUS_ORDER = ['En cours','En attente','En validation','Termine'];
const STATUS_META = {
  'En cours':    { dot:'var(--in-progress)', label:'En cours' },
  'En attente':  { dot:'var(--waiting)', label:'Bloqués' },
  'En validation': { dot:'var(--validation)', label:'Attente JC' },
  'Termine':     { dot:'var(--done)', label:'Terminés' },
};
let ALL = [];
let activeProject = 'all';
let activeStatus = 'all';

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load() {
  try {
    const res = await fetch('/api/kanban/cards');
    const payload = await res.json();
    ALL = payload.cards || [];
  } catch(e) {
    ALL = [];
    document.getElementById('subtitle').textContent = 'erreur de chargement de l\'API';
  }
  render();
}

function render() {
  const projects = [...new Set(ALL.map(c => c.project))].sort();
  const sel = document.getElementById('f-project');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">Tous</option>' + projects.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  sel.value = projects.includes(cur) ? cur : 'all';

  // colonnes : statuses présents, dans l'ordre + les éventuels hors ordre
  const present = new Set(ALL.map(c => c.status));
  const columns = STATUS_ORDER.filter(s => present.has(s))
    .concat([...present].filter(s => !STATUS_ORDER.includes(s)));

  const board = document.getElementById('board');
  board.innerHTML = columns.map(s => `
    <div class="kc">
      <div class="kc-header">
        <span><span class="dot" style="background:${(STATUS_META[s]||{dot:'var(--texte-mute)'}).dot}"></span>${esc((STATUS_META[s]||{label:s}).label)}</span>
        <span class="kc-header-count" id="count-${esc(s)}">0</span>
      </div>
      <div class="kc-list" id="list-${esc(s)}"></div>
    </div>`).join('');

  columns.forEach(s => {
    const list = document.getElementById('list-' + s);
    ALL.filter(c => c.status === s).forEach(card => {
      const clone = document.createElement('div');
      clone.className = 'card';
      clone.dataset.project = card.project;
      clone.dataset.status = card.status;
      clone.innerHTML = `
        <div class="card-top"><span class="card-project">${esc(card.project)}</span><span class="card-prio">${esc(card.priority)}</span></div>
        <div class="card-title">${esc(card.title)}</div>
        <div class="card-owner">👤 ${esc(card.owner)}</div>`;
      list.appendChild(clone);
    });
    if (!list.children.length) {
      list.innerHTML = '<div class="empty">—</div>';
    }
  });

  applyFilters();
}

function setStatus(v, btn) {
  activeStatus = v;
  document.querySelectorAll('.kf-btn[data-filter="status"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  activeProject = document.getElementById('f-project').value;
  let visible = 0;
  const counts = {};
  document.querySelectorAll('.card').forEach(card => {
    const pOk = activeProject === 'all' || card.dataset.project === activeProject;
    const sOk = activeStatus === 'all' || card.dataset.status === activeStatus;
    const show = pOk && sOk;
    card.classList.toggle('hidden', !show);
    if (show) { visible++; counts[card.dataset.status] = (counts[card.dataset.status]||0)+1; }
  });
  STATUS_ORDER.concat(Object.keys(counts)).forEach(s => {
    const el = document.getElementById('count-' + s);
    if (el) el.textContent = counts[s] || 0;
  });
  document.getElementById('statsbar').textContent = `${visible} fiche${visible>1?'s':''} visible${activeProject!=='all' ? ' · ' + activeProject : ''}${activeStatus!=='all' ? ' · ' + activeStatus : ''}`;
}

load();
</script>
</body>
</html>
